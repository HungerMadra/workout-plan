<script>
'use strict';

// =============================================
//  CONFIG  -- Robi: edit these two lines
// =============================================
const FB_PROJECT_ID = 'linda-fitness';
const FB_API_KEY    = 'AIzaSyAyNymBoQTXRmGOgrIjHgZbIibLBLFDoZg';
// =============================================

const FB_ON = FB_PROJECT_ID !== 'YOUR_PROJECT_ID' && FB_API_KEY !== 'YOUR_API_KEY';
const FB_BASE = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT_ID}/databases/(default)/documents`;

// ---------- FIREBASE REST ----------
function fsFields(obj) {
  const f = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v === null || v === undefined) continue;
    if (typeof v === 'boolean') f[k] = {booleanValue: v};
    else if (typeof v === 'number') f[k] = {doubleValue: v};
    else f[k] = {stringValue: String(v)};
  }
  return {fields: f};
}
function fsRead(doc) {
  if (!doc?.fields) return null;
  const o = {};
  for (const [k, v] of Object.entries(doc.fields)) {
    if ('booleanValue' in v) o[k] = v.booleanValue;
    else if ('doubleValue' in v) o[k] = v.doubleValue;
    else if ('integerValue' in v) o[k] = Number(v.integerValue);
    else if ('stringValue' in v) o[k] = v.stringValue;
  }
  return o;
}
async function fbGet(col, id) {
  if (!FB_ON) return null;
  try {
    const r = await fetch(`${FB_BASE}/${col}/${id}?key=${FB_API_KEY}`);
    if (!r.ok) return null;
    return fsRead(await r.json());
  } catch { return null; }
}
async function fbSet(col, id, data) {
  if (!FB_ON) return;
  try {
    await fetch(`${FB_BASE}/${col}/${id}?key=${FB_API_KEY}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fsFields(data))
    });
  } catch {}
}

// ---------- UTILS ----------
function dateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function today() { return dateStr(new Date()); }
function dayOfWeek(ds) { return new Date(ds).getDay(); } // 0=Sun
function fmt(n) { return n.toLocaleString(); }
function yt(q) { return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`; }

const START = new Date('2026-10-01');
function weekNum() {
  const diff = Math.floor((new Date() - START) / 604800000);
  return Math.max(0, diff);
}
function phase() {
  const w = weekNum();
  if (w < 4) return 0;
  if (w < 8) return 1;
  return 2;
}
function waterGoal() {
  const w = weekNum();
  if (w < 2) return 4;
  if (w < 4) return 6;
  return 8;
}
function isRestDay(ds) {
  const d = dayOfWeek(ds);
  return d === 0 || d === 3; // Sun or Wed
}
function isMonthEnd() {
  const n = new Date();
  const last = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
  return n.getDate() >= last - 1;
}
function monthKey() {
  const n = new Date();
  return `${n.getFullYear()}-${n.getMonth()}`;
}
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}
function formatDate(ds) {
  return new Date(ds + 'T00:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}

// ---------- STORE ----------
const Store = {
  _logs: {},
  _meta: {
    achievements: '',    // CSV of unlocked IDs
    streak: 0,
    longestStreak: 0,
    lastStreakDate: '',
    totalSteps: 0,
    totalWorkouts: 0,
    totalSessions: 0,
    currentWeight: 160,
    weighIns: '',        // CSV "date:weight,date:weight"
    cheatEarned: '',     // monthKey when earned
    cheatUsed: '',       // monthKey when used
  },

  load() {
    try { this._logs = JSON.parse(localStorage.getItem('ll_logs') || '{}'); } catch {}
    try { this._meta = {...this._meta, ...JSON.parse(localStorage.getItem('ll_meta') || '{}')}; } catch {}
  },
  saveMeta(patch) {
    this._meta = {...this._meta, ...patch};
    localStorage.setItem('ll_meta', JSON.stringify(this._meta));
    fbSet('meta', 'main', this._meta);
    fbSet('meta', 'logs', {data: JSON.stringify(this._logs)});
  },
  getLog(ds) {
    return this._logs[ds] || {date:ds, steps:0, calBurned:0, water:0, foodLogged:false, workoutDone:false, exDone:''};
  },
  saveLog(ds, patch) {
    this._logs[ds] = {...this.getLog(ds), ...patch};
    localStorage.setItem('ll_logs', JSON.stringify(this._logs));
    fbSet('meta', 'logs', {data: JSON.stringify(this._logs)});
    fbSet('logs', ds, this._logs[ds]);
  },
  allLogs() {
    return Object.values(this._logs).sort((a,b) => b.date.localeCompare(a.date));
  },
  last7Logs() {
    const out = [];
    const n = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(n); d.setDate(d.getDate()-i);
      out.push(this.getLog(dateStr(d)));
    }
    return out;
  },
  weekSteps() {
    // current week Mon-Sun
    const n = new Date();
    const dow = n.getDay();
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const mon = new Date(n); mon.setDate(n.getDate() + mondayOffset);
    let total = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate()+i);
      total += (this.getLog(dateStr(d)).steps || 0);
    }
    return total;
  },
  monthLogs() {
    const n = new Date();
    return Object.values(this._logs).filter(l => {
      const d = new Date(l.date);
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
    });
  },
  achievements() { return (this._meta.achievements || '').split(',').filter(Boolean); },
  hasAch(id) { return this.achievements().includes(id); },
  addAch(id) {
    const cur = this.achievements();
    if (cur.includes(id)) return;
    cur.push(id);
    this.saveMeta({achievements: cur.join(',')});
  },
  weighIns() {
    return (this._meta.weighIns || '').split(',').filter(Boolean).map(s => {
      const [d,w] = s.split(':');
      return {date:d, weight:parseFloat(w)};
    });
  },
  addWeighIn(ds, w) {
    const cur = this.weighIns().filter(x => x.date !== ds);
    cur.push({date:ds, weight:w});
    cur.sort((a,b)=>a.date.localeCompare(b.date));
    this.saveMeta({weighIns: cur.map(x=>`${x.date}:${x.weight}`).join(','), currentWeight: w});
  },
  async syncFirebase() {
    if (!FB_ON) return;
    const [meta, logsDoc] = await Promise.all([fbGet('meta','main'), fbGet('meta','logs')]);
    if (meta) this._meta = {...this._meta, ...meta};
    if (logsDoc?.data) {
      try { const fl = JSON.parse(logsDoc.data); this._logs = {...fl, ...this._logs}; } catch {}
    }
    localStorage.setItem('ll_meta', JSON.stringify(this._meta));
    localStorage.setItem('ll_logs', JSON.stringify(this._logs));
  }
};

// ---------- ACHIEVEMENT QUEUE ----------
let achQueue = [];
function queueAch(id) {
  if (Store.hasAch(id)) return;
  Store.addAch(id);
  achQueue.push(id);
  if (achQueue.length === 1) showNextAch();
}
function showNextAch() {
  if (!achQueue.length) return;
  const id = achQueue[0];
  const a = ACH[id];
  if (!a) { achQueue.shift(); showNextAch(); return; }
  document.getElementById('achIcon').textContent = a.e;
  document.getElementById('achTitle').textContent = a.t;
  document.getElementById('achMsg').textContent = a.msg(id);
  document.getElementById('achOverlay').classList.remove('hidden');
}
function closeAch() {
  achQueue.shift();
  document.getElementById('achOverlay').classList.add('hidden');
  if (achQueue.length) setTimeout(showNextAch, 400);
}

// ---------- TOAST ----------
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.add('hidden'), 2500);
}

// ---------- CHECK ACHIEVEMENTS ----------
function checkAch() {
  const meta = Store._meta;
  const log = Store.getLog(today());
  const logs = Store.allLogs();
  const total = logs.length;

  // Food
  if (log.foodLogged) queueAch('first_log');
  const foodDays = logs.filter(l=>l.foodLogged).length;
  if (foodDays >= 7) queueAch('week_logged');
  if (foodDays >= 30) queueAch('month_logged');

  // Deficit (daily cal deficit = 600 + calBurned)
  const deficit = 600 + (log.calBurned || 0);
  if (deficit > 0 && log.calBurned >= 0 && (log.foodLogged || log.calBurned > 0)) queueAch('first_deficit');
  const defDays = logs.filter(l => (600 + (l.calBurned||0)) > 0 && l.foodLogged).length;
  if (defDays >= 7) queueAch('deficit_week');
  if (defDays >= 14) queueAch('deficit_2week');
  if (defDays >= 30) queueAch('deficit_month');

  // Steps
  if ((log.steps||0) > 0) queueAch('first_steps');
  if ((log.steps||0) >= 10000) queueAch('ten_k');
  const ten_k_days = logs.filter(l=>(l.steps||0)>=10000).length;
  if (ten_k_days >= 3) queueAch('walker_3');
  if (Store.weekSteps() >= 50000) queueAch('week_goal');

  const totalSteps = logs.reduce((a,l)=>a+(l.steps||0),0);
  if (totalSteps >= 250000) queueAch('quarter_mil');
  if (totalSteps >= 500000) queueAch('half_mil');

  // Check hat trick (50K 3 weeks in a row)
  // simplified: 3 of last 4 weeks hit 50K
  let weekHits = 0;
  for (let w = 1; w <= 4; w++) {
    let ws = 0;
    for (let d = 0; d < 7; d++) {
      const dt = new Date(); dt.setDate(dt.getDate() - (w*7) + d);
      ws += Store.getLog(dateStr(dt)).steps||0;
    }
    if (ws >= 50000) weekHits++;
  }
  if (weekHits >= 3) queueAch('hat_trick');

  // Workout
  if (log.workoutDone) queueAch('first_sweat');
  const woTotal = logs.filter(l=>l.workoutDone).length;
  if (woTotal >= 5)  queueAch('handful');
  if (woTotal >= 10) queueAch('double_digits');
  if (woTotal >= 25) queueAch('quarter_cent');
  if (woTotal >= 50) queueAch('fifty_wo');

  // Workouts this week
  let woWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate()-i);
    if (Store.getLog(dateStr(d)).workoutDone) woWeek++;
  }
  if (woWeek >= 5) queueAch('full_week_wo');

  // Check exercises done
  if (log.exDone) {
    const wo = WO[phase()][dayOfWeek(today())];
    if (wo && log.exDone.split(',').filter(Boolean).length >= wo.ex.length) {
      queueAch('session_done');
    }
  }

  // Water
  const wg = waterGoal();
  if ((log.water||0) >= 4) queueAch('first_sip');
  if ((log.water||0) >= 8) queueAch('full_pour');
  const waterDays = logs.filter(l=>(l.water||0)>=wg).length;
  if (waterDays >= 7)  queueAch('water_week');
  if (waterDays >= 30) queueAch('hydration_mo');

  // Weight
  const wis = Store.weighIns();
  if (wis.length >= 1) queueAch('first_weighin');
  if (wis.length >= 1) {
    const lost = 160 - wis[wis.length-1].weight;
    if (lost >= 5)  queueAch('five_down');
    if (lost >= 10) queueAch('halfway');
    if (lost >= 15) queueAch('fifteen_down');
    if (lost >= 20) queueAch('goal_done');
  }

  // Streaks (compute)
  updateStreak();
  const s = Store._meta.streak || 0;
  if (s >= 3)  queueAch('streak_3');
  if (s >= 5)  queueAch('streak_5');
  if (s >= 7)  queueAch('streak_7');
  if (s >= 14) queueAch('streak_14');
  if (s >= 21) queueAch('streak_21');
  if (s >= 30) queueAch('streak_30');
  if (s >= 60) queueAch('streak_60');
  if (s >= 90) queueAch('streak_90');

  // Monthly milestones
  const now = new Date();
  if (now.getMonth()===9 && now.getDate()===31) queueAch('month_1');
  if (now.getMonth()===10 && now.getDate()===30) queueAch('month_2');
  if (now.getMonth()===11 && now.getDate()===31) queueAch('month_3');

  // Perfect day
  const isPerfect = log.foodLogged && (log.water||0) >= Math.max(4, waterGoal()-2) &&
    ((log.steps||0) >= 10000 || isRestDay(today())) &&
    (isRestDay(today()) || log.workoutDone);
  if (isPerfect) queueAch('perfect_day');

  // Perfect week (all 7 days)
  let perfWeek = true;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds2 = dateStr(d);
    const l2 = Store.getLog(ds2);
    const ok = l2.foodLogged && (l2.water||0)>=3 && ((l2.steps||0)>=8000||isRestDay(ds2));
    if (!ok) { perfWeek = false; break; }
  }
  if (perfWeek) queueAch('perfect_week');

  // Cheat day earned
  checkCheatEarned();
}

function updateStreak() {
  let streak = 0;
  const n = new Date();
  for (let i = 0; i < 90; i++) {
    const d = new Date(n); d.setDate(d.getDate()-i);
    const ds = dateStr(d);
    const l = Store.getLog(ds);
    if (ds === today() && !l.foodLogged) continue; // today not logged yet
    const ok = l.foodLogged && ((l.steps||0)>=8000 || isRestDay(ds)) && (l.water||0)>=2;
    if (!ok) break;
    streak++;
  }
  const best = Math.max(streak, Store._meta.longestStreak||0);
  Store.saveMeta({streak, longestStreak: best, lastStreakDate: today()});
}

function checkCheatEarned() {
  const mk = monthKey();
  if (Store._meta.cheatEarned === mk) return;
  const mLogs = Store.monthLogs();
  // Group into weeks (Mon-Sun)
  const weekMap = {};
  for (const l of mLogs) {
    const d = new Date(l.date);
    const mon = new Date(d);
    const dow = d.getDay();
    mon.setDate(d.getDate() - (dow===0?6:dow-1));
    const wk = dateStr(mon);
    if (!weekMap[wk]) weekMap[wk] = {steps:0, wo:0};
    weekMap[wk].steps += l.steps||0;
    if (l.workoutDone) weekMap[wk].wo++;
  }
  let qual = 0;
  for (const w of Object.values(weekMap)) {
    if (w.steps >= 50000 && w.wo >= 4) qual++;
  }
  if (qual >= 3) {
    Store.saveMeta({cheatEarned: mk});
    queueAch('cheat_day');
  }
}

    </div>
    <div style="height:4px;background:#1e1e1e;border-radius:2px;margin-top:12px;overflow:hidden">
      <div style="height:100%;width:${Math.min(100,Math.round(lost/20*100))}%;background:linear-gradient(90deg,#FF4D6D,#06D6A0);border-radius:2px;transition:width 0.4s"></div>
    </div>
    <div style="font-size:10px;color:#333;margin-top:6px;text-align:center">${Math.round(lost/20*100)}% of 20 lb goal</div>
  </div>` : '';

  const weighInSection = showWeighIn ? `
  <div class="weighin-card">
    <div class="wi-title">⚖️ ${new Date().toLocaleString('en-US',{month:'long'})} Weigh-In</div>
    <div class="wi-sub">${todayWI ? `Logged: ${todayWI.weight} lbs` : "It's the end of the month. Want to log your weight? It's optional and only visible to you."}</div>
    ${!todayWI ? `
    <input class="wi-inp" type="number" id="wi-val" placeholder="e.g. 155" inputmode="decimal" step="0.1">
    <button class="wi-btn" onclick="saveWeighIn()">Log My Weight</button>` : ''}
  </div>` : `
  <div style="padding:0 16px 10px">
    <div class="card" style="text-align:center;border-color:#845EC222">
      <div style="font-size:12px;color:#444;line-height:1.7">Monthly weigh-in available on the last day of each month.<br>It's always optional, Linda.</div>
    </div>
  </div>`;

  return `
  <div class="shead">
    <div class="shead-title" style="color:#845EC2">📊 Stats</div>
    <div class="shead-sub">Your numbers tell a great story</div>
  </div>
  <div class="ag">
    <div class="acard" style="border-color:#FF4D6D22">
      <div class="anum" style="color:#FF4D6D">${streak}</div>
      <div class="albl">Day Streak</div>
      <div class="asub">Best: ${meta.longestStreak||0} days</div>
    </div>
    <div class="acard" style="border-color:#06D6A022">
      <div class="anum" style="color:#06D6A0">${fmt(totalSteps)}</div>
      <div class="albl">Total Steps</div>
    </div>
    <div class="acard" style="border-color:#FF4D6D22">
      <div class="anum" style="color:#FF4D6D">${totalWO}</div>
      <div class="albl">Workouts Done</div>
    </div>
    <div class="acard" style="border-color:#845EC222">
      <div class="anum" style="color:#845EC2">${defDays}</div>
      <div class="albl">Days in Deficit</div>
    </div>
    <div class="acard wide" style="border-color:#06D6A022">
      <div class="albl" style="color:#06D6A0;margin-bottom:8px">Steps — Last 7 Days</div>
      <div class="mini-bars">${stepBars}</div>
    </div>
    <div class="acard wide" style="border-color:#FF4D6D22">
      <div class="albl" style="color:#FF4D6D;margin-bottom:8px">Calories Burned — Last 7 Days</div>
      <div class="mini-bars">${calBars}</div>
    </div>
    ${weightSection}
    <div class="acard" style="border-color:#F18F0122">
      <div class="anum" style="color:#F18F01">${foodDays}</div>
      <div class="albl">Days Food Logged</div>
    </div>
    <div class="acard" style="border-color:#FF4D6D22">
      <div class="anum" style="color:#FF4D6D">${achCount}<span style="font-size:16px;color:#333">/${totalAch}</span></div>
      <div class="albl">Achievements</div>
    </div>
  </div>
  ${weighInSection}
  <div style="padding:0 16px 6px"><div class="slabel">Unlocked Achievements</div></div>
  <div class="ach-grid pb">
    ${Object.entries(ACH).map(([id,a])=>`
    <div class="ach-badge ${Store.hasAch(id)?'unlocked':''}">
      <span>${a.e}</span>${a.t}
    </div>`).join('')}
  </div>`;
}

function saveWeighIn() {
  const val = parseFloat(document.getElementById('wi-val')?.value);
  if (!val || val < 80 || val > 400) { toast('Enter a valid weight'); return; }
  Store.addWeighIn(today(), val);
  checkAch(); refresh();
  toast(`${val} lbs logged. Proud of you for showing up.`);
}

// ---------- HISTORY ----------
function renderHistory() {
  const logs = Store.allLogs().slice(0, 90);
  if (!logs.length) return `
  <div class="shead"><div class="shead-title" style="color:#00B4D8">📅 History</div><div class="shead-sub">Your journey, day by day</div></div>
  <div style="padding:40px 16px;text-align:center">
    <div style="font-size:32px;margin-bottom:12px">📖</div>
    <div style="color:#444;font-size:13px;line-height:1.7">Your history will appear here<br>as you start logging your days.</div>
  </div>`;

  const rows = logs.map(l => {
    const steps = l.steps||0;
    const deficit = 600+(l.calBurned||0);
    const wg = waterGoal();
    const score = [l.foodLogged, steps>=10000||isRestDay(l.date), (l.water||0)>=4, l.workoutDone||isRestDay(l.date)].filter(Boolean).length;
    const scoreColor = score===4?'#06D6A0':score>=2?'#F18F01':'#333';
    return `
    <div class="hday">
      <div class="hday-top">
        <div class="hday-date">${formatDate(l.date)}</div>
        <div class="hday-score" style="color:${scoreColor}">${score}/4</div>
      </div>
      <div class="hm-row">
        ${steps>0?`<span class="hm s">👟 ${fmt(steps)}</span>`:''}
        ${l.foodLogged?`<span class="hm f">🍽️ Meals</span>`:''}
        ${(l.water||0)>0?`<span class="hm w">💧 ${l.water} glasses</span>`:''}
        ${l.workoutDone?`<span class="hm wk">💪 Workout</span>`:''}
        ${deficit>0&&l.foodLogged?`<span class="hm d">-${fmt(deficit)} cal</span>`:''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="shead">
    <div class="shead-title" style="color:#00B4D8">📅 History</div>
    <div class="shead-sub">Your journey, day by day</div>
  </div>
  <div style="height:10px"></div>
  ${rows}
  <div style="height:20px"></div>`;
}

// ---------- SETUP ----------
function completeSetup() {
  const pid = document.getElementById('fbPid').value.trim();
  const key = document.getElementById('fbKey').value.trim();
  if (!pid || !key) { alert('Please enter both Firebase values'); return; }
  localStorage.setItem('ll_fb_pid', pid);
  localStorage.setItem('ll_fb_key', key);
  document.getElementById('setup').classList.add('hidden');
  initApp();
}
function skipSetup() {
  localStorage.setItem('ll_setup_done', '1');
  document.getElementById('setup').classList.add('hidden');
  initApp();
}

// ---------- INIT ----------
async function initApp() {
  Store.load();
  go('home');
  // Background Firebase sync
  setTimeout(()=>Store.syncFirebase().then(()=>{ if(curTab==='analytics')refresh(); }), 1500);
}

window.addEventListener('DOMContentLoaded', () => {
  // Check if Firebase is pre-configured in the HTML (Robi's edit)
  if (FB_ON) {
    localStorage.setItem('ll_setup_done', '1');
  }
  // Check if runtime FB config saved (from setup screen)
  const savedPid = localStorage.getItem('ll_fb_pid');
  const savedKey = localStorage.getItem('ll_fb_key');
  if (savedPid && savedKey) {
    window.FB_RUNTIME_PID = savedPid;
    window.FB_RUNTIME_KEY = savedKey;
  }

  const setupDone = localStorage.getItem('ll_setup_done');
  if (!setupDone && !FB_ON) {
    document.getElementById('setup').classList.remove('hidden');
  } else {
    initApp();
  }
});
</script>
</body>
</html>
